name: Cache isolation
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache isolation regression
        run: node tests/cache-isolation.mjs
