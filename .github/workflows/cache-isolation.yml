name: Cache isolation
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache isolation regression
        run: node tests/cache-isolation.mjs
      - name: Install browser checks
        run: |
          python3 -m pip install playwright==1.63.0
          python3 -m playwright install --with-deps chromium
      - name: Full regression and fallback screenshots
        run: |
          python3 tests/check.py
          python3 tests/fallback.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zuerich-390px
          path: test-results/*.png
